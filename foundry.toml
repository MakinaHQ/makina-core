[profile.default]
src = "src"
out = "out"
libs = ["lib"]
evm_version = "cancun"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 150
ignored_warnings_from = ["lib"]
fs_permissions = [{ access = "read-write", path = "./"}]

# Only compile contracts which require IR-based codegen
[profile.ir]
src = "src-ir"
test = "test-ir"
script = "script-ir"
libs = ["lib/enso-weiroll"]
out = "out-ir-based"
via_ir = true

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
base = "${BASE_RPC_URL}"
arbitrum_one = "${ARBITRUM_RPC_URL}"
optimism = "${OPTIMISM_RPC_URL}"
ink = "${INK_RPC_URL}"
avalanche = "${AVALANCHE_RPC_URL}"
unichain = "${UNICHAIN_RPC_URL}"
worldchain = "${WORLDCHAIN_RPC_URL}"
monad = "${MONAD_RPC_URL}"
plasma = "${PLASMA_RPC_URL}"
hyper_evm = "${HYPER_EVM_RPC_URL}"
polygon = "${POLYGON_RPC_URL}"
robinhood = "${ROBINHOOD_RPC_URL}"
arc = "${ARC_RPC_URL}"
tempo = "${TEMPO_RPC_URL}"

[etherscan]
# Ink: Foundry's built-in URL (/api/v2) is not Etherscan-compatible
57073 = { key = "${ETHERSCAN_API_KEY}", url = "https://explorer.inkonchain.com/api" }

[fuzz]
runs = 1024

[invariant]
fail_on_revert = true
runs = 50
